name: Deploy Sqooli landing to Cloudflare Pages

on:
  push:
    branches:
      - UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sqooli-landing/package-lock.json

      - name: Install dependencies
        working-directory: sqooli-landing
        run: npm ci

      - name: Build project
        working-directory: sqooli-landing
        run: npm run build

      - name: Create Cloudflare Pages project if missing
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create sqooli-landing --production-branch=UI

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy sqooli-landing/dist --project-name=sqooli-landing --commit-dirty=true
